services:
  mosasaurus-agent:
    build: .
    container_name: mosasaurus-agent
    restart: unless-stopped
    env_file:
      - ${SECRETS_DIR:-/home/pi/.secrets/mosasaurus}/.env
    environment:
      TZ: Asia/Seoul
      DB_PATH: /app/data/mosasaurus.db
      TOKEN_CACHE_PATH: /run/secrets/token.json
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ${SECRETS_DIR:-/home/pi/.secrets/mosasaurus}/token-cache:/run/secrets:ro
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "from src.db import connect_database; c=connect_database('/app/data/mosasaurus.db'); c.close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
