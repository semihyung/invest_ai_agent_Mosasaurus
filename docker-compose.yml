services:
  mosasaurus-agent:
    build: .
    image: mosasaurus-agent:latest
    container_name: mosasaurus-agent
    restart: unless-stopped
    user: "10001:10001"          # 비root, 그룹 mosasecret(10001)
    read_only: true              # 루트 파일시스템 읽기 전용
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 2g
    pids_limit: 256
    env_file:
      - ${SECRETS_DIR:-/home/pi/.secrets/mosasaurus}/app.env
      # Phase 2 활성화 시에만 추가: ${SECRETS_DIR}/app.phase2.env
    environment:
      TZ: Asia/Seoul
      DB_PATH: /app/data/mosasaurus.db
      TOKEN_CACHE_PATH: /run/secrets/token.json
      APPROVALS_DIR: /run/approvals
      HOST_RUN_DIR: /app/run
      # `python -m backtest.run_report` 가 호스트 ./data/backtests 에 쓴 승인 보고서를 `/approve_backtest` 가 읽는다.
      BACKTEST_DIR: /app/data/backtests
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./run:/app/run:ro        # 호스트가 기록하는 ups.json·clock.json 은 읽기만
      - ${SECRETS_DIR:-/home/pi/.secrets/mosasaurus}/token-cache:/run/secrets:ro
      - ${SECRETS_DIR:-/home/pi/.secrets/mosasaurus}/approvals:/run/approvals:ro
    healthcheck:
      # DB 를 열 수 있는지 + 10초마다 쓰는 heartbeat 가 60초 이내인지(매매 스레드가 죽으면 unhealthy).
      # 복구가 실패해 재시도 중일 때도 heartbeat 가 없으므로 unhealthy 로 보인다(정상 동작).
      test: ["CMD", "python", "-m", "src.health_monitor", "/app/data/mosasaurus.db"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
