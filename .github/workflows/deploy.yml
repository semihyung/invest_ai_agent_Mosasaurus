name: Test and deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Phase 1 and alignment tests
        run: python -m unittest discover -s tests -v

  deploy:
    if: github.repository == 'semihyung/invest_ai_agent_Mosasaurus' && github.ref == 'refs/heads/main'
    needs: test
    environment: production
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - name: Safe deployment
        run: /home/pi/mosasaurus/scripts/safe_deploy.sh
